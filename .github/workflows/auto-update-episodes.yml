name: Auto Sync Podcast Episodes (Thursday)

on:
  schedule:
    # 台灣時間 (UTC+8)：每週四定期自動檢查與同步
    # UTC 00:00 = 台灣時間 08:00
    # UTC 04:00 = 台灣時間 12:00
    # UTC 10:00 = 台灣時間 18:00
    # UTC 14:00 = 台灣時間 22:00
    - cron: '0 0,4,10,14 * * 4'
  workflow_dispatch: # 支援在 GitHub 網頁 Actions 標籤頁手動隨時點擊「Run workflow」
  push:
    branches:
      - main
    paths:
      - 'scripts/fetch-rss.js'

permissions:
  contents: write

concurrency:
  group: sync-episodes
  cancel-in-progress: true

jobs:
  sync:
    name: Fetch & Commit Latest Episodes
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎙️ Fetch Latest RSS Episodes
        run: npm run update-episodes

      - name: 🚀 Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain src/data/)" ]; then
            echo "✨ 發現新發布的單集！正在提交更新..."
            git add src/data/episodes.json src/data/podcast.json
            git commit -m "chore(rss): 🚀 自動同步《宇宙流》最新單集 [skip ci]"
            git push
          else
            echo "✅ 目前已是最新單集，無須提交更新。"
          fi
